<!doctype html><html><head><meta charset="utf-8"><title>Cloudy’s Gloss product film</title><style>html,body{margin:0;background:#f2f3f3}canvas{display:block;width:1280px;height:720px}</style></head><body><canvas id="film" width="1280" height="720"></canvas><script>

const clamp=v=>Math.max(0,Math.min(1,v)),ease=v=>1-(1-clamp(v))**3;
function box(a,b,w,h,r,fill,stroke){x.beginPath();x.roundRect(a,b,w,h,r);if(fill){x.fillStyle=fill;x.fill()}if(stroke){x.strokeStyle=stroke;x.lineWidth=1;x.stroke()}}

function frame(t,dark=false){x.fillStyle=dark?ink:paper;x.fillRect(0,0,1280,720);const color=dark?'#b9bdac':muted;text('CLOUDY’S GLOSS',64,49,13,color,600);text('THE READING ROOM / PRODUCT FILM',846,49,11,color,500);line(64,70,1152,dark?'#4b4d40':'#d8dacf');text('演示画面 · 实际速度与结果取决于模型和设备',64,680,11,color);text(String(Math.floor(t)).padStart(2,'0')+' / 30',1143,680,11,color);box(64,700,1152,3,0,dark?'#424637':'#e0e3d5');box(64,700,1152*t/30,3,0,dark?lime:purple)}

</script></body></html>
