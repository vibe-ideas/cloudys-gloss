name: Product Site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tests/site/**'
      - 'playwright.site.config.ts'
      - 'scripts/build-site.py'
      - '.github/workflows/site.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'tests/site/**'
      - 'playwright.site.config.ts'
      - 'scripts/build-site.py'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Check site in Chrome and Firefox
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm exec playwright install --with-deps chromium
      - id: firefox
        uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795
        with:
          firefox-version: latest
      - name: Test responsive layouts and interactions
        env:
          FIREFOX_BINARY: ${{ steps.firefox.outputs.firefox-path }}
        run: pnpm exec playwright test -c playwright.site.config.ts
      - run: python3 scripts/build-site.py
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: .output/site
      - name: Save browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: product-site-diagnostics
          path: test-results/site/

  deploy:
    name: Deploy product page
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
