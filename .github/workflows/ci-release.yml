name: CI and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Check, browser E2E, and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release.py --tag "$RELEASE_TAG" --validate-only
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Install test browsers
        run: pnpm exec playwright install --with-deps chromium firefox
      - name: Test Chrome and Firefox extensions
        run: pnpm test:e2e
      - name: Build release packages
        run: |
          pnpm zip
          pnpm zip:firefox
          python3 scripts/release.py
      - name: Save release packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: extension-packages
          path: .output/release/*
          if-no-files-found: error
          retention-days: 14
      - name: Save browser test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: extension-packages
          path: release
      - name: Verify checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - name: Create draft, upload, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft >/tmp/release-state.json 2>/dev/null; then
            if ! jq -e '.isDraft == true' /tmp/release-state.json >/dev/null; then
              echo "Release $RELEASE_TAG is already published; refusing to overwrite its assets."
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Cloudy's Gloss $RELEASE_TAG" \
              --notes-file release/RELEASE_NOTES.md --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release/*.zip release/SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false
